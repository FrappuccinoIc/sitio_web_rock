{% extends 'publicaciones/base.html' %}
{% block bloque_definicion %}
<h2>Confirmación eliminar usuario</h2>
{% endblock %}
{% block bloque_contenido %}

<div class="container">
    <h2 class="fs-3 mb-4">Desea eliminar usuario "{{ usuario.username }}"?</h2>
    
    <form action="">
        <button class="btn btn-primary"><a class="fs-4 text-light" href="/foro/perfil/{{ usuario.id }}">Volver atrás</a></button>
        <button class="btn btn-danger fs-4">Eliminar usuario</button>
    </form>
</div>



{% endblock %}
